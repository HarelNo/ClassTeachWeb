services:
  - type: web
    name: classteachweb
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: classteachweb-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
databases:
  - name: classteachweb-db
    databaseName: classteachweb
    user: classteachweb
    plan: free
